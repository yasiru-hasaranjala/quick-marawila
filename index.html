<!DOCTYPE html>
<html>
<head>
    <base href="/quick-marawila/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Driving School System Admin Panel">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Driving School">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Driving School - Admin Panel</title>
    <link rel="manifest" href="manifest.json">

    <script>
        // The value below is injected by flutter build, do not touch.
        const serviceWorkerVersion = "2230606305";
    </script>

    <!-- This script adds the flutter initialization JS code -->
    <script src="flutter.js" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        html, body, #app {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #fafafa;
        }

        .flutter-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .flutter-loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .flutter-loader-text {
            color: white;
            font-family: Roboto, sans-serif;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app" class="flutter-loader">
        <div style="text-align: center;">
            <div class="flutter-loader-spinner"></div>
            <div class="flutter-loader-text">
                <p>Loading Driving School Admin...</p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function(ev) {
            _flutter.loader.loadEntrypoint({
                serviceWorker: {
                    serviceWorkerVersion: serviceWorkerVersion,
                },
                onEntrypointLoaded: function(engineInitializer) {
                    engineInitializer.initializeEngine().then(function(appRunner) {
                        appRunner.runApp();
                    });
                }
            });
        });
    </script>
</body>
</html>
